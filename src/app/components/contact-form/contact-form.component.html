<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">Contactez-nous</h3>

                <!-- Message de confirmation -->
                <div *ngIf="messageSent" class="alert alert-success alert-dismissible fade show" role="alert">
                    Merci pour votre message ! Nous vous répondrons bientôt.
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <form (ngSubmit)="onSubmit()">
                    <div class="mb-3">
                        <label for="firstName" class="form-label">Prénom</label>
                        <input id="firstName" name="firstName" [(ngModel)]="contact.firstName" class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="lastName" class="form-label">Nom</label>
                        <input id="lastName" name="lastName" [(ngModel)]="contact.lastName" class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" name="email" [(ngModel)]="contact.email" class="form-control"
                            required>
                    </div>
                    <div class="mb-3">
                        <label for="subject" class="form-label">Sujet</label>
                        <input id="subject" name="subject" [(ngModel)]="contact.subject" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" name="description" [(ngModel)]="contact.description"
                            class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Envoyer</button>
                </form>
            </div>
        </div>
    </div>
</div>
